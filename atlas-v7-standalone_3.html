<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gulf Beds — Shellbed Atlas (v7, standalone)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<style>
  :root {
    --ink:#111827; --ink-mid:#374151; --muted:#6b7280;
    --line:#e5e7eb; --surface:#fff; --bg:#f9fafb;
    --ocean:#0e4d64; --ocean-mid:#1a6e8e; --ocean-light:#ebf4f7;
    --present:#16a34a; --uncertain:#d97706; --absent:#9ca3af;
    --historic:#8a6a3d; --invasive:#b91c1c; --contested:#7c3aed;
    --gold:#eab308;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0;background:#dfe9ec}

  /* ── Panel ──────────────────────────────────────────────────────── */
  #panel{position:absolute;top:12px;left:12px;bottom:12px;width:318px;z-index:1000;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 6px 28px -12px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
  .p-head{padding:12px 14px 10px;border-bottom:1px solid var(--line);background:var(--ocean);color:#fff;
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .p-head h1{font-size:13px;margin:0;letter-spacing:.02em;font-weight:650}
  .p-head p{margin:3px 0 0;font-size:10.5px;opacity:.82;line-height:1.35}
  .about-btn{flex:none;border:1px solid rgba(255,255,255,.45);background:none;color:#fff;
    font-size:10px;padding:3px 7px;border-radius:4px;cursor:pointer}
  .about-btn:hover{background:rgba(255,255,255,.15)}
  .p-body{overflow-y:auto;flex:1;padding:4px 0 8px}
  .grp{border-bottom:1px solid var(--line);padding:11px 14px 12px}
  .grp:last-child{border-bottom:0}
  .grp-t{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between}
  .grp-t .hint{letter-spacing:0;text-transform:none;font-weight:400;font-size:10px}

  .lens{display:flex;flex-wrap:wrap;gap:5px}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink-mid);border-radius:999px;padding:4px 9px 4px 6px;
    font-size:11px;cursor:pointer;font-style:italic;transition:.12s}
  .chip svg{width:14px;height:14px;flex:none}
  .chip.plain{font-style:normal}
  .chip:hover{border-color:var(--ocean-mid)}
  .chip[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:#fff}
  .chip.inv[aria-pressed="true"]{background:var(--invasive);border-color:var(--invasive)}
  .chip.con[aria-pressed="true"]{background:var(--contested);border-color:var(--contested)}
  .chip.unres{opacity:.55;border-style:dashed}
  .lg-row{cursor:default;border-radius:4px;padding:1px 3px;margin:0 -3px;transition:background .1s}
  .lg-row.hov{cursor:pointer}
  .lg-row.hov:hover{background:var(--ocean-light)}
  .lg-row .lg-n{float:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .mk.dim{opacity:.06;transition:opacity .12s}
  .marker-cluster.dim{opacity:.12;transition:opacity .12s}
  .lg-hint{margin-top:8px;font-size:10px;color:var(--muted);line-height:1.45}
  .lens-note{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.4}
  .lens-note b{color:var(--ink-mid)}
  .chip.grp{font-style:normal;font-weight:600}
  .chip .i{margin-left:1px;opacity:.55;font-style:normal;font-weight:700}
  .chip:hover .i{opacity:1}

  /* species info drawer */
  .spx{margin-top:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
  .spx-h{display:flex;align-items:center;gap:7px;padding:7px 9px;cursor:pointer;
    border:0;background:none;width:100%;text-align:left;font:inherit;font-size:11px;color:var(--ink)}
  .spx-h svg{width:16px;height:16px;flex:none;color:var(--ocean)}
  .spx-h .nm{flex:1;line-height:1.3}
  .spx-h .nm i{display:block;font-size:10px;color:var(--muted);font-style:italic}
  .spx-h .car{font-size:9px;color:var(--muted);transition:transform .15s}
  .spx.open .spx-h .car{transform:rotate(90deg)}
  .spx-b{display:none;padding:0 9px 9px;font-size:10.5px;line-height:1.5;color:var(--ink-mid)}
  .spx.open .spx-b{display:block}
  .spx-b .meta{color:var(--muted);font-size:9.5px;letter-spacing:.05em;
    text-transform:uppercase;font-weight:700;margin:7px 0 3px}
  .spx-b .note{background:#fef3c7;border-left:2.5px solid var(--uncertain);
    color:#78350f;padding:6px 8px;border-radius:3px;margin-top:6px;font-size:10px}
  .spx-b .note.hard{background:#fee2e2;border-left-color:var(--invasive);color:#7f1d1d}
  .spx-b .mem{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .spx-b .mem button{border:1px solid var(--line);background:var(--surface);border-radius:999px;
    font-size:10px;padding:2px 7px;cursor:pointer;color:var(--ink-mid);font-style:italic}
  .spx-b .mem button:hover{border-color:var(--ocean-mid)}
  .spx-b .nodata{color:var(--uncertain)}
  .spx-b .nar{margin-bottom:2px}
  .spx-b .src{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);
    font-size:9.5px;color:var(--muted)}
  .spx-b{max-height:340px;overflow-y:auto}

  .row{display:flex;align-items:flex-start;gap:8px;padding:5px 0}
  .row input{margin:2px 0 0;accent-color:var(--ocean);flex:none}
  .row label{font-size:12px;line-height:1.35;cursor:pointer;flex:1}
  .row .n{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
  .row .sub{display:block;font-size:10px;color:var(--muted);font-style:normal}
  .row input:disabled+label{opacity:.5;cursor:default}
  .stage-i{font-size:9px;font-weight:700;color:var(--ocean-mid);border:1px solid var(--ocean-light);
    background:var(--ocean-light);border-radius:3px;padding:1px 4px;margin-right:5px}
  .disc{background:none;border:0;color:var(--ocean-mid);font-size:10px;cursor:pointer;
    padding:2px 0 0 26px;text-decoration:underline}
  .kids{padding:2px 0 4px 26px;display:none}
  .kids.open{display:block}
  .kids .row{padding:3px 0}
  .kids .row label{font-size:11px;color:var(--ink-mid)}

  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:2px}
  .seg button{flex:1;border:0;background:var(--bg);font-size:10.5px;padding:5px 4px;cursor:pointer;
    color:var(--ink-mid);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--ocean);color:#fff}

  /* ── Legend ─────────────────────────────────────────────────────── */
  .legend{padding:11px 14px 13px;border-top:1px solid var(--line);background:var(--bg)}
  .lg-row{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-mid);padding:2.5px 0}
  .sw{width:13px;height:13px;border-radius:50%;flex:none;border:1.5px solid rgba(0,0,0,.28)}
  .lg-svg{width:17px;height:17px;flex:none}
  .lg-cap{font-size:9.5px;color:var(--muted);margin:7px 0 3px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}

  /* ── Clusters ───────────────────────────────────────────────────── */
  .cl{border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:650;color:#fff;font-variant-numeric:tabular-nums;
    box-shadow:0 1px 5px rgba(0,0,0,.3)}
  .cl-hist{background:rgba(138,106,61,.88);border:2px solid rgba(255,255,255,.85)}
  .cl-mod{background:rgba(22,163,74,.88);border:2px solid rgba(255,255,255,.85)}
  .cl-inv{background:rgba(185,28,28,.88);border:2px solid rgba(255,255,255,.85)}
  .cl-rest{background:rgba(14,77,100,.9);border:2px solid rgba(255,255,255,.85)}

  /* ── Popups ─────────────────────────────────────────────────────── */
  .leaflet-container{font-family:inherit}
  .leaflet-popup-content{margin:11px 13px;width:270px!important}
  .pop{font-size:11.5px;line-height:1.45;max-height:300px;overflow-y:auto;padding-right:2px}
  .pop::-webkit-scrollbar{width:5px}
  .pop::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .pop h3{margin:0 0 1px;font-size:12.5px;font-weight:650}
  .pop .eyebrow{font-size:9px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin-bottom:3px}
  .pop .taxa{margin:5px 0 7px}
  .pop .taxa i{font-weight:600}
  .pop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 9px;font-size:11px}
  .pop dt{color:var(--muted)}
  .pop dd{margin:0}
  .pop .qual{color:var(--muted);font-size:10px}
  .pop .prov{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);
    font-size:10px;color:var(--muted);line-height:1.45}
  .pop img{width:100%;border-radius:4px;margin:6px 0 2px;display:block;background:var(--bg)}
  .pop .credit{font-size:9.5px;color:var(--muted)}
  .pop a{color:var(--ocean-mid)}
  .pop .zoomto{margin-top:7px;border:1px solid var(--line);background:var(--bg);
    font-size:10.5px;padding:4px 8px;border-radius:4px;cursor:pointer;color:var(--ink-mid)}
  .pop .zoomto:hover{border-color:var(--ocean-mid)}

  /* ── Chrome ─────────────────────────────────────────────────────── */
  .readout{position:absolute;right:12px;bottom:12px;z-index:1000;background:rgba(17,24,39,.82);
    color:#fff;font-size:10.5px;padding:5px 9px;border-radius:5px;font-variant-numeric:tabular-nums}
  .basemap{position:absolute;right:12px;top:12px;z-index:1000;display:flex;background:var(--surface);
    border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .basemap button{border:0;background:none;font-size:11px;padding:6px 10px;cursor:pointer;color:var(--ink-mid)}
  .basemap button.on{background:var(--ocean);color:#fff}

  /* ── About drawer ───────────────────────────────────────────────── */
  #about{position:absolute;inset:0;z-index:1200;background:rgba(17,24,39,.55);
    display:none;padding:34px 18px;overflow-y:auto}
  #about.open{display:block}
  .ab{max-width:660px;margin:0 auto;background:var(--surface);border-radius:9px;padding:22px 26px 26px}
  .ab h2{margin:0 0 3px;font-size:16px}
  .ab .lede{color:var(--muted);font-size:11.5px;margin:0 0 16px}
  .ab h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ocean);
    margin:19px 0 6px;font-weight:700}
  .ab p,.ab li{font-size:12px;line-height:1.6;color:var(--ink-mid)}
  .ab ul{margin:4px 0;padding-left:18px}
  .ab .cite{font-size:11px;line-height:1.55;padding:7px 0;border-bottom:1px solid var(--line)}
  .ab .cite b{color:var(--ink)}
  .ab .cite .role{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
  .ab .warn{background:#fef3c7;border-left:2.5px solid var(--uncertain);padding:8px 11px;
    border-radius:4px;font-size:11.5px;color:#78350f;line-height:1.55;margin:5px 0}
  .ab .close{float:right;border:1px solid var(--line);background:var(--bg);font-size:11px;
    padding:4px 10px;border-radius:5px;cursor:pointer}
  .ab table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
  .ab th,.ab td{text-align:left;padding:4px 7px;border-bottom:1px solid var(--line);vertical-align:top}
  .ab th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
  .ab code{background:var(--bg);padding:1px 4px;border-radius:3px;font-size:10.5px}

  @media (max-width:720px){
    #panel{width:auto;right:12px;bottom:auto;max-height:58%}
    .readout{bottom:auto;top:56px;right:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<div class="basemap">
  <button data-bm="osm" class="on">Structures</button>
  <button data-bm="sat">Satellite</button>
  <button data-bm="ocean">Bathymetry</button>
</div>
<div class="readout">zoom <span id="zlev">7</span> · <span id="znote">—</span> · <span id="vis">0</span> shown</div>

<div id="panel">
  <div class="p-head">
    <div>
      <h1>Gulf Beds — Shellbed Atlas</h1>
      <p>Historical and living shellfish reefs of South Australia</p>
    </div>
    <button class="about-btn" id="openAbout">About</button>
  </div>

  <div class="p-body">
    <div class="grp">
      <div class="grp-t">Species lens</div>
      <div class="lens" id="lens"></div>
      <div class="lens-note" id="lensnote"></div>
    </div>

    <div class="grp">
      <div class="grp-t">Layers <span class="hint">records shown</span></div>
      <div id="arc"></div>
    </div>

    <div class="grp">
      <div class="grp-t">Origin <span class="hint">filters every layer</span></div>
      <div class="seg" id="og">
        <button data-og="all" class="on">All</button>
        <button data-og="native">Native</button>
        <button data-og="introduced">Introduced</button>
        <button data-og="contested">Contested</button>
      </div>
      <div class="lens-note" id="ognote"></div>
    </div>

    <div class="grp">
      <div class="grp-t">Context <span class="hint">regulatory</span></div>
      <div id="ctx"></div>
    </div>

  </div>

  <div class="legend" id="legend"></div>
</div>

<div id="about"><div class="ab"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
/* inlined from data/species.js */
/* data/species.js — Gulf Beds Shellbed Atlas
   =========================================================================
   SINGLE SOURCE OF TRUTH for taxa. Adding a species = adding one object
   here. Lens chips, marker shapes, legend, filters, popups and the iNat
   build script all read from this file and nothing else.

   FIELD CONTRACT
     key            internal id, used in historical.js / field.js / inat.js
     sci            scientific name as displayed (italicised by the UI)
     authority      author, year
     common         common name to display
     common_alt     other names in circulation, shown in the drawer
     inat_taxon_id  iNaturalist taxon id
     inat_verified  true only where checked against a live iNat page
     role           builder | associate | epifaunal | indeterminate
     origin         native | introduced | contested | unresolved
     sa_status      SA regulatory status, where one exists
     group          parent group key, for roll-up lenses
     members        for a group key: the member keys it rolls up
     blurb          plain-language explainer shown in the lens drawer
     taxon_note     the caveat. If non-empty the map MUST show it.
     path           26x26 viewBox SVG path — the shell icon

   VERIFICATION LOG (2026-07-31)
     confirmed  Malleus meridianus — iNat 765693
     confirmed  Trichomya hirsuta — iNat 353604, in 2026-07 SA export
     CHANGED    Brachidontes rostratus -> Austromytilus rostratus. iNat now
                serves this as taxon 1597877; the old id 147934 is stale.
     REVERSED   Brachidontes erosus was previously blocked as unverifiable.
                That was wrong: WoRMS AphiaID 505993, ALA species page, and
                13 SA observations in the 2026-07 export. Unblocked.
     ADDED      Brachidontes ustulatus, Musculus nana — both appeared in the
                family-level Mytilidae export and had no registry entry.
     FLAGGED    Mytilus — see taxon_note. Not a clean "invasive" call.
   ========================================================================= */

window.ATLAS_SPECIES = {

  /* ── Tier 1: reef builders, the structural focus ─────────────────────── */

  angasi: {
    sci: "Ostrea angasi", authority: "Sowerby, 1871",
    common: "Native flat oyster", common_alt: ["Angasi oyster", "mud oyster"],
    inat_taxon_id: null, inat_verified: false,
    role: "builder", origin: "native", sa_status: null, group: null,
    blurb: "The species the whole restoration programme is built around. " +
           "Formed extensive subtidal beds across both gulfs before the " +
           "19th-century dredge fishery removed them. Every restored reef " +
           "in South Australia is seeded with or targeted at this animal.",
    taxon_note: null,
    path: "M13 3C7 3 3 7 3 13c0 5 4 10 11 10 6 0 9-5 9-11 0-6-4-9-10-9Z"
  },

  malleus: {
    sci: "Malleus meridianus", authority: "Cotton, 1930",
    common: "Hammer oyster", common_alt: [],
    inat_taxon_id: 765693, inat_verified: true,
    role: "builder", origin: "native", sa_status: null, group: null,
    blurb: "A hammer-shaped bivalve that anchors in soft sediment and, in " +
           "aggregation, builds structure the way an oyster bed does. Much " +
           "less studied than angasi and with a far thinner historical " +
           "record — only two historical sites in this atlas name it.",
    taxon_note: null,
    path: "M4 6c0-1 18-1 18 0s-6 2-7 4c-1 2 0 10-1 13-1 1-3 1-3 0-1-3 0-11-1-13S4 7 4 6Z"
  },

  pinna: {
    sci: "Pinna bicolor", authority: "Gmelin, 1791",
    common: "Razorfish", common_alt: ["Common razor clam", "razor shell"],
    inat_taxon_id: null, inat_verified: false,
    role: "builder", origin: "native", sa_status: null, group: null,
    blurb: "Large fan-shaped bivalve that stands upright half-buried in " +
           "seagrass and sand. Dense stands create hard substrate and " +
           "vertical relief in otherwise soft habitat, so it counts as a " +
           "builder even though it does not cement into a reef.",
    taxon_note: "The v3 prototype recorded this as Pinna dolabrata, which " +
                "is not the South Australian species. Corrected to " +
                "P. bicolor. Confirm against WoRMS before publication.",
    path: "M4 4c6 1 13 2 18 4-2 6-6 11-9 16-3-5-7-10-9-20Z"
  },

  /* ── Tier 2: associated reef biodiversity ────────────────────────────── */

  katelysia: {
    sci: "Katelysia spp.", authority: "Römer, 1857",
    common: "Cockle", common_alt: ["Goolwa cockle (K. scalarina)"],
    inat_taxon_id: null, inat_verified: false,
    role: "associate", origin: "native", sa_status: null, group: null,
    blurb: "Infaunal clams of sheltered sand and seagrass flats. Not reef " +
           "builders, but their presence indicates the sediment conditions " +
           "that shellbeds need. Recorded at genus level throughout — " +
           "K. scalarina and K. rhytiphora are not separable in photos.",
    taxon_note: "Only three live-annotated observations exist in the SA " +
                "iNaturalist record. That is too few to support any " +
                "distribution or density claim.",
    path: "M13 5C5 5 3 10 3 15c0 6 5 8 10 8s10-2 10-8c0-5-2-10-10-10Z"
  },

  equichlamys: {
    sci: "Equichlamys bifrons", authority: "Lamarck, 1819",
    common: "Queen scallop", common_alt: ["doughboy scallop"],
    inat_taxon_id: null, inat_verified: false,
    role: "associate", origin: "native", sa_status: null, group: null,
    blurb: "A free-living scallop of seagrass and rubble bottoms. Reads as " +
           "an indicator of habitat quality rather than a builder — it " +
           "recruits to structurally complex bottom, so its return to a " +
           "restored site is a useful secondary signal.",
    taxon_note: null,
    path: "M13 22H9v-2C4 18 2 13 2 9c0-5 5-6 11-6s11 1 11 6c0 4-2 9-7 11v2Z"
  },

  /* ── Mytilidae: group key + members ──────────────────────────────────── */

  mytilidae: {
    sci: "Mytilidae", authority: "Rafinesque, 1815",
    common: "Mussels", common_alt: [],
    inat_taxon_id: 50600, inat_verified: true,
    role: "builder", origin: "native", sa_status: null,
    group: null,
    members: ["mytilus", "trichomya", "austromytilus",
              "brach_erosus", "brach_ustulatus", "musculus", "mytilidae_indet"],
    narrative: [
      ["Why this is a group, not a species",
       "Six mussel taxa are recorded in South Australian waters in this " +
       "build, and a large share of the records never reach species level " +
       "at all. Forcing them into separate chips would either hide the " +
       "unidentified ones or quietly assign them to a species nobody " +
       "identified. The group key keeps both readable."],
      ["What sits underneath",
       "Two native reef-formers — Trichomya hirsuta and Austromytilus " +
       "rostratus. Two native rock-crevice species — Brachidontes erosus " +
       "and B. ustulatus. One small nestler, Musculus nana. And Mytilus, " +
       "the blue mussel, which is its own problem."],
      ["Reading the counts",
       "Select the group to see every mussel record. Select a member to " +
       "see only records identified to that level. The difference between " +
       "the two numbers is the size of the identification gap."]
    ],
    blurb: "A roll-up, not a species. South Australian mussels are a genuine " +
           "identification problem: most community records stop at genus or " +
           "family because the animals are not separable from a photograph. " +
           "Selecting this chip shows every mussel record including those " +
           "never resolved below family. Selecting a member shows only " +
           "records identified to that level. The atlas never promotes a " +
           "record to a finer rank than the identifier gave it.",
    taxon_note: null,
    path: "M5 6s4-2 9 0 8 6 8 10c0 5-5 7-9 6C8 21 5 15 5 6Z"
  },

  mytilus: {
    sci: "Mytilus", authority: "Linnaeus, 1758",
    common: "Blue mussel", common_alt: ["black mussel", "Mytilus planulatus",

      coordinates and obscured iNaturalist locations get a dashed halo and

   5. Alive/dead is a user filter rather than an upstream exclusion.
   6. Popups lead with WHAT THE RECORD IS, not where it is. A lease
      boundary and a diver's observation are different claims and the
      atlas should never let them look identical.
   ═══════════════════════════════════════════════════════════════════════ */

const SPECIES = window.ATLAS_SPECIES;
const FILL    = window.ATLAS_STATUS_FILL;
const SOURCES = window.ATLAS_SOURCES;
const HIST    = window.ATLAS_HISTORICAL || [];
const INAT    = window.ATLAS_INAT || {};
const IMETA   = window.ATLAS_INAT_META || null;
const FIELD   = window.ATLAS_FIELD || [];
const REST    = window.ATLAS_RESTORATION || [];
const PROG    = window.ATLAS_RESTORATION_PROGRAMMES || {};
const PARKS   = window.ATLAS_MARINE_PARKS || null;
const LEASES  = window.ATLAS_AQUACULTURE || null;

/* ── Basemaps. maxNativeZoom stops Leaflet requesting tiles the provider
      does not have, which is what produced the blank panels in v2. ───── */
const map = L.map("map",{zoomControl:true,maxZoom:21}).setView([-33.9,136.6],7);
const BASES = {
  sat:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {attribution:"Tiles &copy; Esri",maxNativeZoom:18,maxZoom:21}),
  ocean:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",
    {attribution:"Tiles &copy; Esri — GEBCO, NOAA",maxNativeZoom:13,maxZoom:21}),
  osm:L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {attribution:"&copy; OpenStreetMap contributors",maxNativeZoom:19,maxZoom:21})
};
const LABELS = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  {maxNativeZoom:12,maxZoom:21,opacity:.9});
let activeBase = BASES.osm.addTo(map); LABELS.addTo(map);
document.querySelectorAll(".basemap button").forEach(b=>b.onclick=()=>{
  map.removeLayer(activeBase);
  activeBase = BASES[b.dataset.bm].addTo(map);
  if(b.dataset.bm==="osm") map.removeLayer(LABELS); else LABELS.addTo(map);
  document.querySelectorAll(".basemap button").forEach(x=>x.classList.toggle("on",x===b));
  readout();
});

/* ── Marker encoding ───────────────────────────────────────────────────
   shape = species, fill = status, gold ring = recruitment,
   dashed grey halo = location we do not trust. Three channels, all
   independently readable. Everything else belongs in the popup. ─────── */
let FILL_TALLY={};
function icon(spKey,status,o={}){
  FILL_TALLY[status]=(FILL_TALLY[status]||0)+1;
  const s = SPECIES[spKey], sz = o.size||26;
  const fill = FILL[status]||"var(--muted)";
  let rings = "";
  if(o.imprecise) rings += `<circle cx="13" cy="13" r="11.6" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="3 2.5" opacity=".85"/>`;
  if(o.recruitment) rings += `<circle cx="13" cy="13" r="11.6" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`;
  const body = s
    ? `<path d="${s.path}" fill="${fill}" stroke="rgba(0,0,0,.5)" stroke-width="1.1"/>`
    : `<circle cx="13" cy="13" r="6" fill="${fill}" stroke="rgba(0,0,0,.5)" stroke-width="1.1"/>`;
  return L.divIcon({className:`mk mk-${status}`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
    html:`<svg viewBox="0 0 26 26" width="${sz}" height="${sz}" style="opacity:${o.dim?.62:1}">${rings}${body}</svg>`});
}
const chipSvg = k => `<svg viewBox="0 0 26 26"><path d="${SPECIES[k].path}" fill="currentColor" opacity=".85"/></svg>`;

/* ── Clustering. One factory, four palettes, so a cluster tells you
      which evidence class it belongs to before you open it. ─────────── */
function clusterGroup(kind){
  return L.markerClusterGroup({
    maxClusterRadius: z => z<8?58:z<11?42:26,
    disableClusteringAtZoom:15,
    spiderfyOnMaxZoom:true,
    showCoverageOnHover:false,
    chunkedLoading:true,
    iconCreateFunction(c){
      const n=c.getChildCount();
      const d=n<10?30:n<50?36:n<200?43:50;
      return L.divIcon({html:`<div class="cl cl-${kind}" style="width:${d}px;height:${d}px">${n}</div>`,
        className:"",iconSize:[d,d]});
    }
  });
}

/* ── Click to zoom ─────────────────────────────────────────────────────
   Zoom target scales with how much we trust the coordinate. There is no
   honesty in flying to z18 on a point rounded to two decimal places. ── */
function zoomTo(lat,lng,imprecise){
  const target = imprecise ? 12 : 16;
  map.flyTo([lat,lng], Math.max(map.getZoom(), target), {duration:.7});
}
function bindZoom(marker,lat,lng,imprecise){
  marker.on("click",()=>zoomTo(lat,lng,imprecise));
  return marker;
}

/* ── Popup builders ───────────────────────────────────────────────────
   Every popup answers, in this order:
     1. What kind of record is this?
     2. What species, and did anything co-occur?
     3. When, and how precisely do we know that?
     4. Where did it come from, specifically?
     5. What should you not do with it?
   ─────────────────────────────────────────────────────────────────── */
const EVIDENCE_LABEL = {
  lease_or_claim_boundary:"Lease or claim boundary",
  declared_closure_area:"Declared closure area",
  observation_or_account:"Observation or account"
};
const ARCHIVAL_LABEL = {
  fisheries_report:"Fisheries report", newspaper:"Newspaper",
  lease_register:"Lease register", admiralty_chart:"Admiralty chart",
  survey_plan:"Survey plan", oral_history:"Oral history",
  museum_specimen:"Museum specimen", scientific_survey:"Scientific survey",
  place_name:"Place name evidence"
};
const VERIF_LABEL = {
  not_assessed:"Not assessed", desktop_checked:"Desktop checked",
  field_revisited:"Revisited, inconclusive", field_confirmed:"Confirmed in field",
  field_absent:"Searched, not found"
};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const taxaLine = keys => keys.map(k=>{
  const s=SPECIES[k]; if(!s) return esc(k);
  return `<i>${esc(s.sci)}</i>${s.common&&s.common!=="name unverified"?` <span style="color:var(--muted)">${esc(s.common)}</span>`:""}`;
}).join("<br>");
const dl = rows => rows.filter(r=>r[1]!=null&&r[1]!=="").map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");

const ORIGIN_BADGE = {
  native:      ["Native", "var(--present)"],
  introduced:  ["Introduced / pest-listed", "var(--invasive)"],
  contested:   ["Contested origin", "var(--contested)"],
  unresolved:  ["Not identified to species", "var(--muted)"]
};
function originBadge(keys){
  const seen=[...new Set(keys.map(k=>SPECIES[k]?.origin).filter(Boolean))];
  return seen.map(o=>{
    const [t,c]=ORIGIN_BADGE[o]||[o,"var(--muted)"];
    return `<span style="display:inline-block;font-size:9px;font-weight:700;
      letter-spacing:.05em;text-transform:uppercase;color:#fff;background:${c};
      border-radius:3px;padding:1px 5px;margin:0 3px 3px 0">${esc(t)}</span>`;
  }).join("");
}
function taxonFlags(keys){
  return keys.map(k=>SPECIES[k]?.taxon_note).filter(Boolean)
    .map(n=>`<div class="flag${/UNRESOLVED|CONTESTED|EXOTIC/.test(n)?" hard":""}">${esc(n)}</div>`).join("");
}

function histPopup(h){
  const imp = h.coord_coarse;
  return `<div class="pop">
    <div class="eyebrow">${EVIDENCE_LABEL[h.evidence_type]||"Historical record"} &middot; ${esc(h.region)}</div>
    <h3>${esc(h.label)}</h3>
    <div class="taxa">${taxaLine(h.species)}${originBadge(h.species)}</div>
    <dl>${dl([
      ["Date", esc(h.date_text)],
      ["Confidence", `${esc(h.confidence_source)} <span class="qual">as classed in source</span>`],
      ["Extent", h.area_ha!=null
        ? `${h.area_ha} ha${h.area_is_shared_polygon?' <span class="qual">shared polygon &mdash; do not sum</span>':""}`
        : null],
      ["Substrate", h.substrate?esc(h.substrate.replace(/_/g," ")):null],
      ["Depth", h.depth_m!=null?`${h.depth_m} m`:null],
      ["Co-occurring", h.co_occurrence?`<code>${esc(h.eco_class_source)}</code>`:null],
      ["Precision", imp
        ? `<span class="qual">rounded in source to ~1 km or coarser</span>`
        : esc(h.coord_precision)]
    ])}</dl>
    ${h.photo_url?`<img src="${esc(h.photo_url)}" alt="" loading="lazy"><div class="credit">${esc(h.photo_credit||"")}</div>`:""}
    <div class="prov">${SOURCES.martin2025.short} &middot; mmc2 &middot; CC BY 4.0 &middot; <code>${esc(h.id)}</code></div>
    <button class="zoomto" onclick="zoomTo(${h.lat},${h.lng},${!!imp})">Zoom to site</button>
  </div>`;
}

function fieldPopup(f){
  const keys = Object.keys(f.species||{});
  return `<div class="pop">
    <div class="eyebrow">${f.source==="lindsey2026"?"Published survey":"EyreLab field survey"}</div>
    <h3>${esc(f.name)}</h3>
    ${originBadge(keys)}
    <div class="taxa">${keys.map(k=>{
      const e=f.species[k];
      return `<i>${esc(SPECIES[k]?.sci||k)}</i> &mdash; ${esc(e.status)}${e.recruitment==="yes"?` <span style="color:#a16207">recruitment</span>`:""}`;
    }).join("<br>")}</div>
    <dl>${dl([
      ["Surveyed", esc(f.date||"")],
      ["Method", esc(f.method||"not stated")],
      ["Substrate", f.substrate?esc(f.substrate.replace(/_/g," ")):null],
      ["Depth", f.depth_m!=null?`${f.depth_m} m`:null],
      ["Zone", esc(f.zone||"")],
      ["Note", f.note?esc(f.note):null]
    ])}</dl>
    ${f.photo_url?`<img src="${esc(f.photo_url)}" alt="" loading="lazy"><div class="credit">${esc(f.photo_credit||"EyreLab")}</div>`:""}
    <div class="prov">${esc((SOURCES[f.source]||SOURCES.eyrelab).short)}${f.survey_id?` &middot; <code>${esc(f.survey_id)}</code>`:""}</div>
    <button class="zoomto" onclick="zoomTo(${f.lat},${f.lng},false)">Zoom to site</button>
  </div>`;
}

function inatPopup(r){
  const s = SPECIES[r.species_key];
  const imp = r.geoprivacy_obscured || (r.positional_accuracy_m && r.positional_accuracy_m>1000);
  const rank = r.identified_to_rank && r.identified_to_rank!=="species";
  return `<div class="pop">
    <div class="eyebrow">iNaturalist &middot; research grade</div>
    <h3><i>${esc(s?.sci||r.taxon_name_as_recorded)}</i></h3>
    ${originBadge([r.species_key])}
    <div class="taxa" style="color:var(--muted);font-size:11px">${esc(s?.common||"")}</div>
    ${r.photo_url?`<img src="${esc(r.photo_url)}" alt="" loading="lazy"><div class="credit">${esc(r.photo_attribution||"")} &middot; ${esc(r.photo_licence||"")}</div>`:""}
    <dl>${dl([
      ["Observed", esc(r.observed_on||"date not given")],
      ["Identified to", rank?`${esc(r.identified_to_rank)} <span class="qual">not resolved to species</span>`:"species"],
      ["Recorded as", r.taxon_name_as_recorded&&r.taxon_name_as_recorded!==s?.sci
        ?`<i>${esc(r.taxon_name_as_recorded)}</i>`:null],
      ["Agreements", r.num_identification_agreements!=null?r.num_identification_agreements:null],
      ["Location", r.geoprivacy_obscured
        ? `obscured <span class="qual">randomised ~20 km &mdash; not for spatial analysis</span>`
        : (r.positional_accuracy_m!=null?`&plusmn;${r.positional_accuracy_m} m`:null)],
      ["Locality", esc(r.place_guess||"")],
      ["Observer", esc(r.observer_name||r.observer||"")]
    ])}</dl>
    <div class="prov">
      Licence ${esc(r.licence||"not stated")} &middot;
      <a href="${esc(r.url)}" target="_blank" rel="noopener">observation ${r.id}</a>
    </div>
    <button class="zoomto" onclick="zoomTo(${r.lat},${r.lng},${!!imp})">Zoom to point</button>
  </div>`;
}

const COORD_LABEL = {
  as_supplied:"as supplied by the programme",
  approximate:"approximate — derived from a published description",
  derived_from_description:"DERIVED, NOT SURVEYED"
};
function restPopup(r){
  const prog = PROG[r.programme]||{};
  const built = r.stage==="built";
  return `<div class="pop">
    <div class="eyebrow">${esc(prog.short||"Restoration")} &middot; ${built?"built":esc(r.stage)}</div>
    <h3>${esc(r.name)}</h3>
    <dl>${dl([
      ["Programme", esc(prog.label||"")],
      ["Deployed", esc(r.deployed||"not yet built")],
      ["Extent", r.area_ha!=null?`${r.area_ha} ha`:null],
      ["Depth", r.depth_m?`${esc(String(r.depth_m))} m`:null],
      ["Substrate", esc((r.substrate||"").replace(/_/g," "))],
      ["Stocking", esc((r.stocking||"").replace(/_/g," "))],
      ["Coordinates", esc(COORD_LABEL[r.coord_status]||r.coord_status)]
    ])}</dl>
    ${r.note?`<div style="margin-top:7px">${esc(r.note)}</div>`:""}

    ${(r.monitoring||[]).length?`<div style="margin-top:9px">
      <div class="eyebrow">Oyster density and recruitment</div>
      ${r.monitoring.map(([h,body,src])=>`<div style="margin-top:5px">
        <b>${esc(h)}</b><br>${esc(body)}
        <span style="color:var(--muted)">&mdash; ${esc(src)}</span></div>`).join("")}
    </div>`:""}

    ${r.caveat?`<div class="prov" style="border-top:0;padding-top:4px">${esc(r.caveat)}</div>`:""}
    ${r.partners?`<div class="prov"><b>Partners</b><br>${esc(r.partners)}</div>`:""}
    ${r.link?`<div class="prov"><a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link_label||"Programme page")} &rarr;</a></div>`:""}
    <button class="zoomto" onclick="zoomTo(${r.lat},${r.lng},false)">Zoom to reef</button>
  </div>`;
}

/* ── State + layers ───────────────────────────────────────────────────── */
const state = {
  lens:"all",
  stages:new Set(["s2-eyre","s2-lind","s2-inat","s3-tnc","s3-r25"]),
  origin:"all",
  spxOpen:false
};
/* Sub-layers are real Leaflet groups, not decorative checkboxes. Each can
   be toggled independently; the parent count is the sum of its children. */
const groups = {
  "s1":        clusterGroup("hist"),   // historical record
  "s2-eyre":   clusterGroup("mod"),    // EyreLab dive surveys
  "s2-lind":   clusterGroup("mod"),    // Lindsey et al. 2026
  "s2-inat":   clusterGroup("mod"),    // iNaturalist
  "s3-tnc":    clusterGroup("rest"),   // TNC / SA Gov limestone reefs
  "s3-r25":    clusterGroup("rest")    // EyreLab 25 Reefs
};
const PARENT = { "s1":["s1"],
                 "s2":["s2-eyre","s2-lind","s2-inat"],
                 "s3":["s3-tnc","s3-r25"] };

function statusForSpecies(k,base){
  const o = SPECIES[k]?.origin;
  if(o==="introduced") return "introduced";
  if(o==="contested")  return "contested";
  return base;
}

function build(){
  FILL_TALLY={};
  Object.values(groups).forEach(g=>g.clearLayers());
  const lens = state.lens, all = lens==="all";
  const set = lensKeys(lens);

  /* 1 — historical */
  HIST.forEach(h=>{
    const spp = h.species.filter(s=>lensMatch(set,s) && originMatch(s));
    if(!spp.length) return;
    bindZoom(L.marker([h.lat,h.lng],
      {icon:icon(spp[0],"historic",{size:22,dim:true,imprecise:h.coord_coarse})})
      .bindPopup(histPopup(h),{maxWidth:250}), h.lat,h.lng,h.coord_coarse)
      .addTo(groups.s1);
  });

  /* 2 — modern presence: our surveys, collaborators', and the public's */
  FIELD.forEach(f=>{
    const keys = Object.keys(f.species||{}).filter(k=>lensMatch(set,k) && originMatch(k));
    if(!keys.length) return;
    const e = f.species[keys[0]];
    bindZoom(L.marker([f.lat,f.lng],
      {icon:icon(keys[0],statusForSpecies(keys[0],e.status),{recruitment:e.recruitment==="yes"})})
      .bindPopup(fieldPopup(f),{maxWidth:250}), f.lat,f.lng,false)
      .addTo(groups[f.source==="lindsey2026"?"s2-lind":"s2-eyre"]);
  });

  Object.entries(INAT).forEach(([k,arr])=>{
    if(!lensMatch(set,k) || !originMatch(k)) return;
    (arr||[]).forEach(r=>{
      const imp = r.geoprivacy_obscured || (r.positional_accuracy_m>1000);
      bindZoom(L.marker([r.lat,r.lng],
        {icon:icon(k,statusForSpecies(k,"present"),{size:20,imprecise:imp})})
        .bindPopup(inatPopup(r),{maxWidth:250}), r.lat,r.lng,imp)
        .addTo(groups["s2-inat"]);
    });
  });

  /* 3 — restoration, split by programme */
  REST.forEach(r=>{
    if(!lensMatch(set,"angasi") || !originMatch("angasi")) return;
    bindZoom(L.marker([r.lat,r.lng],
      {icon:icon("angasi","rest-"+r.programme,{size:24,imprecise:r.coord_status!=="as_supplied"})})
      .bindPopup(restPopup(r),{maxWidth:250}), r.lat,r.lng,false)
      .addTo(groups["s3-"+r.programme]);
  });

  Object.entries(groups).forEach(([k,g])=>
    state.stages.has(k)?g.addTo(map):map.removeLayer(g));
  counts();
  if(document.getElementById("legend")) drawLegend();
}

function counts(){
  let total=0;
  Object.entries(groups).forEach(([k,g])=>{
    const n=g.getLayers().length;
    if(state.stages.has(k)) total+=n;
    const el=document.querySelector(`[data-n="${k}"]`); if(el) el.textContent=n;
  });
  Object.entries(PARENT).forEach(([p,kids])=>{
    const n=kids.reduce((a,k)=>a+(state.stages.has(k)?groups[k].getLayers().length:0),0);
    const el=document.querySelector(`[data-n="${p}"]`); if(el) el.textContent=n;
  });
  document.getElementById("vis").textContent=total;
}

/* ── Species lens ─────────────────────────────────────────────────────── */
const lensEl = document.getElementById("lens");

/* Group keys roll up their members. A group chip matches any record whose
   species key is the group itself or any member of it — so selecting
   "Mussels" shows records identified only to family alongside those
   identified to species, without ever promoting one to the other. */
const MEMBERS = k => SPECIES[k]?.members || null;
function lensKeys(lens){
  if(lens==="all") return null;                 // null = match everything
  const m = MEMBERS(lens);
  return new Set(m ? [lens,...m] : [lens]);
}
function lensMatch(set,key){ return !set || set.has(key); }

/* Chips hide member keys behind their group so the row stays legible.
   The drawer exposes the members. */
const TOP_KEYS = Object.keys(SPECIES).filter(k=>!SPECIES[k].group);

function hasData(k){
  const set = lensKeys(k);
  return HIST.some(h=>h.species.some(s=>lensMatch(set,s)))
      || Object.entries(INAT).some(([sk,a])=>lensMatch(set,sk)&&(a||[]).length>0)
      || FIELD.some(f=>Object.keys(f.species||{}).some(s=>lensMatch(set,s)));
}
function recordCount(k){
  const set = lensKeys(k); let n=0;
  HIST.forEach(h=>{ if(h.species.some(s=>lensMatch(set,s))) n++; });
  Object.entries(INAT).forEach(([sk,a])=>{ if(lensMatch(set,sk)) n+=(a||[]).length; });
  FIELD.forEach(f=>{ if(Object.keys(f.species||{}).some(s=>lensMatch(set,s))) n++; });
  return n;
}

function roleWord(r){
  return r==="builder"?"reef-building" : r==="associate"?"associated"
       : r==="epifaunal"?"epifaunal" : "not resolved";
}

function drawLens(){
  const order=["all",...TOP_KEYS];
  lensEl.innerHTML=order.map(k=>{
    if(k==="all") return `<button class="chip plain" data-sp="all" aria-pressed="${state.lens==="all"}">All species</button>`;
    const s=SPECIES[k];
    const cls = (s.members?" grp":"")
              + (s.origin==="introduced"?" inv" : s.origin==="contested"?" con"
              : s.origin==="unresolved"?" unres" : "");
    const label = s.common && s.common!=="name unverified" ? s.common : s.sci;
    return `<button class="chip${cls}" data-sp="${k}" aria-pressed="${state.lens===k}"
      title="${esc(s.sci)} ${esc(s.authority)} — click for detail">${chipSvg(k)}${esc(label)}<span class="i">${state.lens===k?"&#9650;":"&#9660;"}</span></button>`;
  }).join("");
  lensEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const same = state.lens===b.dataset.sp;
    if(same && b.dataset.sp!=="all"){        // second click collapses
      state.lens="all"; state.spxOpen=false;
    } else {
      state.lens=b.dataset.sp; state.spxOpen=(b.dataset.sp!=="all");
    }
    drawLens(); build();
  });
  drawSpeciesInfo();
}

/* Expandable per-species drawer. This is where the mussel story lives —
   introduction, mixing, and the absence of consensus — rather than being
   buried in a popup nobody opens. */
function drawSpeciesInfo(){
  const note=document.getElementById("lensnote");
  if(state.lens==="all"){
    note.innerHTML=`All taxa shown. Shapes overlap where beds co-occurred — pick one
      to read the map cleanly. Chips marked <b>Mussels</b> roll several taxa together.`;
    return;
  }
  const k=state.lens, s=SPECIES[k], n=recordCount(k);
  const hard=/UNRESOLVED|CONTESTED|EXOTIC|error/i.test(s.taxon_note||"");
  const mem = (s.members||[]).filter(m=>SPECIES[m]);

  note.innerHTML=`<div class="spx open" id="spx">
    <div class="spx-b">
      <div>${esc(s.blurb||"No summary written for this taxon yet.")}</div>

      <div class="meta">In this atlas</div>
      <div>${roleWord(s.role)} &middot; ${esc(s.origin)}${s.sa_status?" &middot; "+esc(s.sa_status.replace(/_/g," ")):""}
        &middot; ${n} record${n===1?"":"s"}${n?"":' <span class="nodata">— registry entry only</span>'}</div>

      ${s.common_alt&&s.common_alt.length?`<div class="meta">Also called</div>
        <div>${s.common_alt.map(esc).join(", ")}</div>`:""}

      ${s.inat_taxon_id?`<div class="meta">iNaturalist taxon</div>
        <div>${s.inat_taxon_id} ${s.inat_verified
          ?'<span style="color:var(--present)">verified</span>'
          :'<span style="color:var(--uncertain)">not verified</span>'}</div>`:""}

      ${mem.length?`<div class="meta">Rolls up</div>
        <div class="mem">${mem.map(m=>`<button data-jump="${m}">${esc(SPECIES[m].sci)}</button>`).join("")}</div>`:""}

      ${s.group?`<div class="meta">Part of</div>
        <div class="mem"><button data-jump="${s.group}">${esc(SPECIES[s.group].common)}</button></div>`:""}

      ${(s.narrative||[]).map(([h,body])=>
        `<div class="meta">${esc(h)}</div><div class="nar">${esc(body)}</div>`).join("")}

      ${s.taxon_note?`<div class="note${hard?" hard":""}">${esc(s.taxon_note)}</div>`:""}

      ${(s.narrative||[]).length?`<div class="src">Full citations are in About.</div>`:""}
    </div></div>`;

  note.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{
    state.lens=b.dataset.jump; state.spxOpen=true; drawLens(); build();
  });
}

/* ── Layer panel ──────────────────────────────────────────────────────────
   Parent rows toggle their whole subtree. Child rows are live layer
   switches, not the decorative disabled checkboxes of v4 — the "sources"
   disclosure now does something. Citations live in About, not here. */
const ARC=[
  {k:"s1", i:"1", t:"Historical record",
   sub:"Martin et al. 2025 — reef sites, leases and closures",
   kids:[["s1","All historical records"]]},
  {k:"s2", i:"2", t:"Modern presence",
   sub:"Surveys and community observations",
   kids:[["s2-eyre","EyreLab dive surveys"],
         ["s2-lind","Lindsey et al. 2026 — Coffin Bay"],
         ["s2-inat","iNaturalist — community science"]]},
  {k:"s3", i:"3", t:"Restoration",
   sub:"Built and planned reefs",
   kids:[["s3-tnc","SA Government / The Nature Conservancy"],
         ["s3-r25","EyreLab — 25 Reefs"]]}
];

document.getElementById("arc").innerHTML=ARC.map(a=>{
  const kids=a.kids.filter(([k])=>groups[k]);
  const anyOn=kids.some(([k])=>state.stages.has(k));
  return `<div class="row">
    <input type="checkbox" id="cb-${a.k}" ${anyOn?"checked":""}>
    <label for="cb-${a.k}"><span class="stage-i">${a.i}</span>${a.t}<span class="sub">${a.sub}</span></label>
    <span class="n" data-n="${a.k}">0</span></div>
  ${a.k==="s1"?"":`<button class="disc" data-t="${a.k}">layers</button>
  <div class="kids open" id="k-${a.k}">${kids.map(([k,label])=>
    `<div class="row"><input type="checkbox" id="cb-${k}" ${state.stages.has(k)?"checked":""}>
      <label for="cb-${k}">${label}</label>
      <span class="n" data-n="${k}">0</span></div>`).join("")}</div>`}`;
}).join("");

document.querySelectorAll(".disc").forEach(b=>b.onclick=()=>
  document.getElementById("k-"+b.dataset.t).classList.toggle("open"));

function setLayer(k,on){
  on?state.stages.add(k):state.stages.delete(k);
  const g=groups[k]; if(!g) return;
  on?g.addTo(map):map.removeLayer(g);
}
ARC.forEach(a=>{
  const kids=a.kids.filter(([k])=>groups[k]).map(([k])=>k);
  const parent=document.getElementById("cb-"+a.k);
  parent.onchange=e=>{
    kids.forEach(k=>{
      setLayer(k,e.target.checked);
      const cb=document.getElementById("cb-"+k); if(cb) cb.checked=e.target.checked;
    });
    counts();
  };
  kids.forEach(k=>{
    const cb=document.getElementById("cb-"+k);
    if(!cb||cb===parent) return;
    cb.onchange=e=>{
      setLayer(k,e.target.checked);
      parent.checked=kids.some(x=>state.stages.has(x));
      counts();
    };
  });
});

/* ── Condition + precision filters ────────────────────────────────────── */
const ORIGIN_LABEL = {
  native:"Native to South Australia",
  introduced:"Introduced, feral, invasive or pest-listed",
  contested:"Origin contested, or never identified to species"
};
function originOf(key){ return SPECIES[key]?.origin || "unresolved"; }
/* Three buckets, not four. "introduced" absorbs feral, invasive and
   pest-listed — they are one management category. "contested" absorbs
   "unresolved", because from a reader's point of view both mean the same
   thing: we cannot tell you where this animal came from. */
const ORIGIN_BUCKET = {
  native:"native", introduced:"introduced",
  contested:"contested", unresolved:"contested"
};
function originMatch(key){
  return state.origin==="all" || ORIGIN_BUCKET[originOf(key)]===state.origin;
}
document.querySelectorAll("#og button").forEach(b=>b.onclick=()=>{
  state.origin=b.dataset.og;
  document.querySelectorAll("#og button").forEach(x=>x.classList.toggle("on",x===b));
  const n=document.getElementById("ognote");
  n.innerHTML = state.origin==="all" ? "" :
    `<b>${esc(ORIGIN_LABEL[state.origin])}.</b> ` + (
      state.origin==="contested"
        ? "One taxon sits here: <i>Mytilus</i>. Southern Australian blue mussels are an endemic lineage plus introduced genetic material, with hybridisation between them, and no South Australian genetic study resolves which is which. The atlas will not pick for you."
      : state.origin==="introduced"
        ? "Read as a pressure layer, not a recovery layer. iNaturalist cannot separate farmed from feral animals."
        : "Excludes introduced, pest-listed and contested taxa."
    );
  build();
});

/* ── Context layers ───────────────────────────────────────────────────────
   Marine parks and aquaculture leases as real polygon layers. Off by
   default: they are context, not evidence, and they cover a lot of map. */
const AQUA_FILL={oyster:"#8B5E34",mussel:"#1C2541"};
const ctxLayers={};

if(PARKS){
  ctxLayers.parks=L.geoJSON(PARKS,{
    style:()=>({color:"#1a6e8e",weight:1,fillColor:"#1a6e8e",fillOpacity:.07}),
    onEachFeature:(f,l)=>{
      const p=f.properties||{};
      l.bindPopup(`<div class="pop">
        <div class="eyebrow">Marine park &middot; outer boundary</div>
        <h3>${esc(p.name||p.NAME||"Marine park")}</h3>
        <div class="qual" style="margin-top:5px">Outer boundary only &mdash; internal
          zoning is not in the source data and is not shown.</div>
        <div class="prov">DEW / data.sa.gov.au &middot; CC BY 4.0 AU</div></div>`,{maxWidth:250});
    }});
}
if(LEASES){
  ctxLayers.leases=L.geoJSON(LEASES,{
    style:f=>{
      const p=f.properties||{}, active=p.status==="Active";
      return {color:AQUA_FILL[p.species]||"#666",weight:active?1:1.2,
        dashArray:active?null:"3 2",fillColor:AQUA_FILL[p.species]||"#666",
        fillOpacity:active?.3:.08};
    },
    onEachFeature:(f,l)=>{
      const p=f.properties||{};
      l.bindPopup(`<div class="pop">
        <div class="eyebrow">Aquaculture lease &middot; ${esc(p.species||"")}</div>
        <h3>${esc(p.zone||"Lease")}</h3>
        <dl>${dl([["Registration",esc(p.reg_no||"")],["Type",esc(p.reg_type||"")],
          ["Status",esc(p.status||"")],["Area",p.area_ha?p.area_ha+" ha":null],
          ["Approved",esc(p.approve_date||"")],["Expires",esc(p.expiry_date||"")]])}</dl>
        <div class="qual" style="margin-top:5px">A licensing polygon &mdash; what may be
          farmed, not what is in the water.</div>
        <div class="prov">PIRSA / data.sa.gov.au &middot; CC BY 3.0 AU</div></div>`,{maxWidth:250});
    }});
}

const CTX=[
  ["parks","Marine parks",PARKS?`${PARKS.features.length} parks &middot; outer boundaries only`:"not loaded"],
  ["leases","Aquaculture leases",LEASES?`${LEASES.features.length} lease polygons &middot; PIRSA`:"not loaded"]
];
document.getElementById("ctx").innerHTML=CTX.map(([k,t,sub])=>
  `<div class="row"><input type="checkbox" id="ctx-${k}" ${ctxLayers[k]?"checked":"disabled"}>
   <label for="ctx-${k}">${t}<span class="sub">${sub}</span></label></div>`).join("");
CTX.forEach(([k])=>{
  const cb=document.getElementById("ctx-"+k);
  if(!ctxLayers[k]) return;
  ctxLayers[k].addTo(map);
  cb.onchange=e=>e.target.checked?ctxLayers[k].addTo(map):map.removeLayer(ctxLayers[k]);
});

/* ── Legend ───────────────────────────────────────────────────────────────
   Built from the data, not hand-written, so an entry can never describe a
   colour that is not on the map. Counts are live. Hovering a row isolates
   that class; the rest fade rather than disappear so the spatial context
   stays readable. */
const LEGEND=[
  ["cap","Fill \u2014 status"],
  ["present",    "Present, confirmed in water"],
  ["uncertain",  "Uncertain, indirect evidence"],
  ["absent",     "Surveyed, not found"],
  ["historic",   "Historical record"],
  ["introduced", "Introduced, feral or pest-listed"],
  ["contested",  "Contested origin, or not identified to species"],
  ["cap","Restoration"],
  ["rest-tnc",   "SA Government / The Nature Conservancy"],
  ["rest-r25",   "EyreLab \u2014 25 Reefs"],
  ["cap","Outline \u2014 qualifier"]
];

function legendCounts(){ return FILL_TALLY; }

function drawLegend(){
  const n=legendCounts();
  const rows=LEGEND.map(([k,label])=>{
    if(k==="cap") return `<div class="lg-cap">${label}</div>`;
    if(!n[k]) return "";                       // never show an unused colour
    return `<div class="lg-row hov" data-iso="${k}">
      <span class="sw" style="background:${FILL[k]}"></span>${label}
      <span class="lg-n">${n[k]}</span></div>`;
  }).join("");

  document.getElementById("legend").innerHTML = rows + `
    <div class="lg-row"><svg class="lg-svg" viewBox="0 0 26 26">
      <circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
      <circle cx="13" cy="13" r="6" fill="var(--present)"/></svg> Recruitment confirmed</div>
    <div class="lg-row"><svg class="lg-svg" viewBox="0 0 26 26">
      <circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 2.5"/>
      <circle cx="13" cy="13" r="6" fill="var(--historic)"/></svg> Location imprecise or approximate</div>
    <div class="lg-hint">Shape encodes species. Hover a colour to isolate it.
      Click any point to zoom to it.</div>`;

  document.querySelectorAll("#legend .lg-row.hov").forEach(row=>{
    row.onmouseenter=()=>isolate(row.dataset.iso);
    row.onmouseleave=()=>isolate(null);
  });
}

function isolate(key){
  document.querySelectorAll(".mk").forEach(el=>
    el.classList.toggle("dim", !!key && !el.classList.contains("mk-"+key)));
  document.querySelectorAll(".marker-cluster").forEach(el=>
    el.classList.toggle("dim", !!key));
}

/* ── Readout ──────────────────────────────────────────────────────────── */
function readout(){
  const z=map.getZoom(), nat=activeBase.options.maxNativeZoom;
  document.getElementById("zlev").textContent=z;
  document.getElementById("znote").textContent = z>nat?`upscaled from z${nat}`:"native tiles";
}
map.on("zoomend",readout);

/* ── About drawer ─────────────────────────────────────────────────────── */
const nCoarse = HIST.filter(h=>h.coord_coarse).length;
const nShared = HIST.filter(h=>h.area_is_shared_polygon).length;
const nCo     = HIST.filter(h=>h.co_occurrence).length;
const nFilled = HIST.filter(h=>h.source_detail).length;
const nInat   = Object.values(INAT).reduce((a,v)=>a+(v||[]).length,0);
const nLegacy = Object.values(INAT).flat().filter(r=>r.legacy_export).length;
const unres   = Object.entries(SPECIES).filter(([,s])=>s.origin==="unresolved").map(([k])=>k);

document.querySelector("#about .ab").innerHTML=`
  <button class="ab-x" onclick="document.getElementById('about').classList.remove('open')">Close</button>

  <h2>Gulf Beds Shellbed Atlas</h2>
  <p class="lede">An observation atlas of South Australia's shellbeds &mdash; where
  reef-building bivalves were recorded historically, where they are found now, and
  where reefs are being rebuilt. It carries records and their provenance. It does
  not model habitat suitability, and it does not predict where reefs could go.</p>

  <h3>Contents</h3>
  <table>
    <tr><th>Layer</th><th>Records</th><th>Source</th></tr>
    <tr><td>Historical record</td><td>${HIST.length}</td>
      <td>Martin et al. (2025), dataset mmc2</td></tr>
    <tr><td>EyreLab dive surveys</td><td>${FIELD.filter(f=>f.source==="eyrelab").length}</td>
      <td>EyreLab, unpublished</td></tr>
    <tr><td>Coffin Bay sanctuary sites</td><td>${FIELD.filter(f=>f.source==="lindsey2026").length}</td>
      <td>Lindsey et al. (2026)</td></tr>
    <tr><td>Community observations</td><td>${nInat}</td>
      <td>iNaturalist${IMETA?`, retrieved ${esc(IMETA.retrieved)}`:""}</td></tr>
    <tr><td>Restoration</td><td>${REST.length}</td>
      <td>${REST.filter(r=>r.programme==="tnc").length} TNC / SA Government,
          ${REST.filter(r=>r.programme==="r25").length} EyreLab 25 Reefs</td></tr>
    <tr><td>Marine parks</td><td>${PARKS?PARKS.features.length:0}</td>
      <td>DEW, outer boundaries only</td></tr>
    <tr><td>Aquaculture leases</td><td>${LEASES?LEASES.features.length:0}</td>
      <td>PIRSA</td></tr>
  </table>

  <h3>How to read the map</h3>
  <p>Marker <b>shape</b> encodes species; <b>fill</b> encodes status. A gold ring
  marks confirmed recruitment; a dashed outline marks a coordinate that is
  imprecise or approximate. Species is a filter rather than an encoding, because
  shape cannot carry ${Object.keys(SPECIES).length} taxa legibly at marker size &mdash;
  select one from the lens to read the map cleanly, and select it again to clear.</p>

  <h3>Taxonomy</h3>
  <p>The species registry is the single source of truth for names, authorities,
  origin and iNaturalist taxon identifiers. Where a name is unsettled the registry
  says so and the atlas declines to resolve it &mdash; the reasoning sits in the
  species panel, not in individual records. Three entries carry substantive
  taxonomic notes: <i>Mytilus</i> (contested origin),
  <i>Pinctada albina</i> (rank mismatch against the PIRSA pest listing), and
  the unresolved Mytilidae bucket.</p>
  <p><i>Pinna</i> is recorded here as <i>P. bicolor</i>. An earlier prototype used
  <i>P. dolabrata</i>, which is not the South Australian species.</p>

  <h3>Community observations</h3>
  <p>${IMETA?`${IMETA.source_rows} observations were exported from iNaturalist on
  ${esc(IMETA.retrieved)}. ${nInat} are carried here.`:""} Every record in this layer
  is research grade &mdash; the identification has been agreed by the iNaturalist
  community. Records identified only to genus or family are kept at that rank and
  are never promoted to a species.</p>
  <p>Three exclusions are applied at build time and each is counted:</p>
  <table>
    <tr><th>Excluded</th><th>Count</th></tr>
    ${IMETA?Object.entries(IMETA.excluded||{}).map(([k,v])=>
      `<tr><td>${esc(k.replace(/_/g," "))}</td><td>${v}</td></tr>`).join(""):""}
  </table>
  <p>Dead and beach-cast records are identified from the observer's own description
  and tags. Place names are deliberately not scanned: a locality called Shelley
  Beach says nothing about the condition of the animal. Coordinates are discarded
  only where no water exists within 6 km on a 1 km land mask &mdash; a stricter test
  rejects valid estuarine records, because the mask cannot resolve the Port River
  or West Lakes.</p>
  ${IMETA&&(IMETA.quarantined_on_land||[]).length?`<p><b>${IMETA.quarantined_on_land.length}
  records plot inland</b> on that mask and are retained pending manual review:
  ${IMETA.quarantined_on_land.map(q=>`${q.id} (${q.km_to_water} km, ${esc(q.place||"no locality")})`).join("; ")}.</p>`:""}

  <h3>Restoration monitoring</h3>
  <p>Published density figures are <b>not comparable between reefs, or even within
  one reef</b>. DEW reports adult oysters per square metre; The Nature Conservancy
  reports all individuals per square metre. Glenelg carries both &mdash; over 50
  adults per m&sup2; at 2.5 years, and about 2,436 individuals per m&sup2; at two
  years. Those are two counts of the same reef, not a decline. Windara's headline
  figure is settlement-panel recruitment, which measures larval supply rather than
  survival. O'Sullivan Beach and Nepean Bay have no published quantitative figure.</p>
  <p>DEW's assessment of all four reefs is stated as applying <i>prior to</i> the
  2025 <i>Karenia mikimotoi</i> bloom. Nothing here describes post-bloom condition.</p>
  <p>Only reefs in the water are shown. Planned and pending sites are excluded.</p>

  <h3>Coordinates</h3>
  <p>Restoration positions are approximate unless stated otherwise in the record.
  Nepean Bay is reconstructed from a published description rather than surveyed:
  the previous atlas value sat about 9 km from American River, inconsistent with
  the programme's own account of a site 4 km offshore. PIRSA publishes GPS points
  for the metropolitan reefs and those should replace these.</p>
  <p>Historical coordinates are digitised from source maps, not surveyed. Community
  records with obscured geoprivacy are randomised by iNaturalist within roughly
  20 km &mdash; wider than most South Australian bays &mdash; and are marked as such.</p>

  <h3>Context layers</h3>
  <p>Marine park polygons are outer boundaries only. Internal zoning &mdash;
  sanctuary, habitat protection, restricted access, general managed use &mdash; is
  not in the published dataset and is not shown. This layer cannot tell you what
  activity is permitted anywhere. Aquaculture polygons are licensing boundaries:
  they describe what may be farmed, not what is in the water or at what density.</p>

  <h3>Scope</h3>
  <p>This atlas carries observation records. Derived surfaces &mdash; suitability,
  connectivity, predicted extent &mdash; belong to a separate model and are
  deliberately absent. Extents shown here are as recorded in their sources and are
  not analytically reliable; several historical area values recur across multiple
  records because one digitised polygon was assigned to several sites, and those
  are marked where they occur.</p>

  <h3>Sources</h3>
  <table>
    <tr><th>Source</th><th>Role in this build</th></tr>
    ${Object.values(SOURCES).map(s=>`<tr><td><b>${esc(s.short)}</b><br>
      <span style="color:var(--muted)">${esc(s.cite)}</span></td>
      <td>${esc(s.role)}${s.verify?`<br><span style="color:var(--uncertain)">Unverified against the publisher record${s.verify_note?` &mdash; ${esc(s.verify_note)}`:""}.</span>`:""}</td></tr>`).join("")}
  </table>

  <h3>Reuse</h3>
  <p>Historical data is CC BY 4.0 from Martin et al. (2025). Marine parks are
  CC BY 4.0 AU (DEW); aquaculture leases CC BY 3.0 AU (PIRSA). iNaturalist
  licences vary per observation and are stated on each record. EyreLab survey data
  is unpublished &mdash; contact EyreLab before reuse.</p>
`;

document.getElementById("openAbout").onclick=()=>document.getElementById("about").classList.add("open");
document.querySelector("#about").addEventListener("click",e=>{
  if(e.target.id==="about"||e.target.id==="closeAbout")
    document.getElementById("about").classList.remove("open");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") document.getElementById("about").classList.remove("open");
});

/* ── Go ───────────────────────────────────────────────────────────────── */
drawLens(); build(); readout();
if(!HIST.length) console.warn("data/historical.js not loaded — run scripts/build_historical.py");
if(!Object.keys(INAT).length) console.warn("data/inat.js empty — run scripts/update_inat.py");
</script>
</body>
</html>
